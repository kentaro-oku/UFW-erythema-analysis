<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// STEP 2 spec: 4s / 1080p / 24fps -> 96 frames
const W = 1920, H = 1080, FRAMES = 96;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;
const BG = '#ececec';
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 14, 30);

// ---------- materials ----------
const silver = new THREE.MeshStandardMaterial({ color: '#f2f2f4', metalness: 1, roughness: 0.12, envMapIntensity: 1.8 });
const black = new THREE.MeshPhysicalMaterial({ color: '#0d0d0f', roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.05 });
const clear = new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.04, transmission: 1, thickness: 0.15, ior: 1.5, transparent: true });
const glass = new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.04, metalness: 0, transparent: true, opacity: 0.22, clearcoat: 1, clearcoatRoughness: 0.02, envMapIntensity: 1.6, depthWrite: false });

// vertical gradient (clear top -> black bottom) for bottle 1's contents
function gradientTex() {
  const c = document.createElement('canvas'); c.width = 8; c.height = 512; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#d4d5d8'); gr.addColorStop(0.3, '#a9aaae');
  gr.addColorStop(0.62, '#3a3a3e'); gr.addColorStop(1, '#0a0a0c');
  g.fillStyle = gr; g.fillRect(0, 0, 8, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// brand mark: open ring (crescent "C")
function drawMark(g, cx, cy, r, color) {
  g.save(); g.strokeStyle = color; g.lineCap = 'round';
  g.lineWidth = r * 0.22; g.beginPath(); g.arc(cx, cy, r, Math.PI * 0.62, Math.PI * 2.32); g.stroke();
  g.lineWidth = r * 0.08; g.beginPath(); g.arc(cx + r * 0.08, cy, r * 0.66, Math.PI * 0.75, Math.PI * 2.2); g.stroke();
  g.restore();
}

// label textures (transparent background, printed straight on the bottle)
function label({ num, name, top, bottom, w = 2048, h = 2048, layout }) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.clearRect(0, 0, w, h); g.textAlign = 'center';
  const cx = w / 2;
  for (const it of layout) {
    if (it.t === 'mark') drawMark(g, cx, it.y, it.r, it.c);
    else { g.fillStyle = it.c; g.font = it.f; g.fillText(it.s, cx, it.y); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

const products = new THREE.Group(); scene.add(products);

// ---------- 1: TONE-UP ESSENCE (gradient glass, silver cap) ----------
function makeEssence() {
  const g = new THREE.Group();
  const H1 = 2.35, R1 = 0.46;
  const shell = new THREE.Mesh(new THREE.CylinderGeometry(R1, R1, H1, 96), glass); shell.position.y = H1 / 2; shell.castShadow = true; g.add(shell);
  const inner = new THREE.Mesh(new THREE.CylinderGeometry(R1 - 0.04, R1 - 0.04, H1 - 0.08, 96, 1, false),
    new THREE.MeshPhysicalMaterial({ map: gradientTex(), roughness: 0.25, clearcoat: 0.6 }));
  inner.position.y = H1 / 2; g.add(inner);
  const lab = label({ layout: [
    { t: 'mark', y: 520, r: 110, c: 'rgba(70,70,74,0.9)' },
    { s: 'TERASTIE', f: '400 74px Georgia, serif', y: 735, c: 'rgba(70,70,74,0.9)' },
    { s: '1', f: '400 230px Georgia, serif', y: 1500, c: 'rgba(240,240,240,0.95)' },
    { s: 'SKIN CONDITIONER', f: '400 34px Georgia, serif', y: 1640, c: 'rgba(230,230,230,0.85)' },
    { s: 'TONE-UP ESSENCE', f: '500 60px Georgia, serif', y: 1730, c: 'rgba(240,240,240,0.95)' },
  ]});
  const labMesh = new THREE.Mesh(new THREE.CylinderGeometry(R1 + 0.004, R1 + 0.004, H1, 128, 1, true, -Math.PI * 0.5, Math.PI),
    new THREE.MeshStandardMaterial({ map: lab, transparent: true, roughness: 0.4, depthWrite: false }));
  labMesh.position.y = H1 / 2; g.add(labMesh);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(R1, R1, 0.52, 96), silver); cap.position.y = H1 + 0.26; cap.castShadow = true; g.add(cap);
  return g;
}

// ---------- 2 / 3: black airless pump bottles ----------
function makePump(num, name) {
  const g = new THREE.Group();
  const R = 0.3;
  const base = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 0.32, 96), silver); base.position.y = 0.16; base.castShadow = true; g.add(base);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 1.75, 96), black); body.position.y = 0.32 + 0.875; body.castShadow = true; g.add(body);
  const lab = label({ w: 1536, h: 2048, layout: [
    { t: 'mark', y: 330, r: 95, c: '#e9e9ea' },
    { s: 'TERASTIE', f: '400 64px Georgia, serif', y: 520, c: '#e9e9ea' },
    { s: String(num), f: '400 200px Georgia, serif', y: 1300, c: '#f2f2f2' },
    { s: 'SKIN CONDITIONER', f: '400 30px Georgia, serif', y: 1520, c: '#cfcfd1' },
    { s: name, f: '500 54px Georgia, serif', y: 1600, c: '#f2f2f2' },
  ]});
  const labMesh = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.003, R + 0.003, 1.75, 128, 1, true, -Math.PI * 0.5, Math.PI),
    new THREE.MeshStandardMaterial({ map: lab, transparent: true, roughness: 0.3, depthWrite: false }));
  labMesh.position.y = body.position.y; g.add(labMesh);
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.98, R, 0.1, 96), silver); collar.position.y = 2.12; g.add(collar);
  const pump = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.32, 64), silver); pump.position.y = 2.33; g.add(pump);
  const nozzle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.16), silver); nozzle.position.set(0, 2.42, 0.13); g.add(nozzle);
  const over = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.97, R * 0.97, 0.62, 96, 1, false), clear); over.position.y = 2.48; g.add(over);
  return g;
}

const p1 = makeEssence(); const p2 = makePump(2, 'REGEN SERUM'); const p3 = makePump(3, 'RICH CREAM');
p2.position.set(-1.25, 0, -0.35); p1.position.set(0, 0, 0.15); p3.position.set(1.25, 0, -0.35);
p2.rotation.y = 0.1; p3.rotation.y = -0.1;
products.add(p1, p2, p3);

// mirrored copy for a glossy-floor reflection
const mirror = products.clone(true); mirror.scale.y = -1; scene.add(mirror);
mirror.traverse(o => { if (o.isMesh) { o.castShadow = false; } });

// floor: semi-opaque white over the reflection
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: '#f4f4f4', roughness: 0.6, transparent: true, opacity: 0.8 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = 0.001; floor.receiveShadow = true; scene.add(floor);

// lights: studio, key from upper right throws long diagonal shadows (like the official set photo)
const key = new THREE.DirectionalLight('#ffffff', 3.2); key.position.set(6, 6, 3); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 }); key.shadow.bias = -0.0004; key.shadow.radius = 4;
scene.add(key);
const fill = new THREE.DirectionalLight('#f3f5f8', 1.0); fill.position.set(-6, 3, 5); scene.add(fill);
const rim = new THREE.DirectionalLight('#ffffff', 1.6); rim.position.set(-3, 4, -6); scene.add(rim);
scene.add(new THREE.HemisphereLight('#ffffff', '#bdbdbd', 0.5));

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const L = THREE.MathUtils.lerp;

window.renderFrame = (i) => {
  const t = i / (FRAMES - 1), e = ease(t);
  // macro on bottle 1's brand mark -> pull back and settle on the 2-1-3 lineup
  const ang = L(-0.5, 0.0, e);
  const rad = L(3.3, 7.6, e);
  const y = L(2.35, 2.05, e);
  camera.position.set(Math.sin(ang) * rad, y, Math.cos(ang) * rad + 0.15);
  camera.lookAt(L(0.05, 0, e), L(2.05, 1.6, e), 0.15);
  p1.rotation.y = ang;
  p2.rotation.y = L(-0.2, 0.1, e); p3.rotation.y = L(-0.9, -0.1, e);
  mirror.children.forEach((m, k) => { m.rotation.y = [p1, p2, p3][k].rotation.y; });
  renderer.render(scene, camera);
  return true;
};
window.ready = true;
</script></body></html>
